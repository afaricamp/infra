Port 8888
Listen 0.0.0.0
Timeout 600

# Los clientes válidos son los que están en la red interna 'jail-internal'.
# El aislamiento real lo da la red (Claude no tiene ruta externa), no este Allow.
Allow 0.0.0.0/0

# Solo permitir CONNECT hacia HTTPS.
ConnectPort 443

# --- Allowlist estricta: se DENIEGA todo lo que no coincida ---
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/allowlist"
FilterExtended On
FilterCaseSensitive Off

DisableViaHeader Yes
