Port 8888
Listen 0.0.0.0
Timeout 600

# Every request and its outcome, in the container log (podman logs claude-proxy;
# 'make egress-log' sums it up). Info, not Connect: a CONNECT to a port other
# than 443 is only logged at Info.
LogLevel Info

# The only valid clients are the ones on the 'jail-internal' network.
# The real isolation comes from the network topology (Claude has no external
# route), not from this Allow directive.
Allow 0.0.0.0/0

# Only permit CONNECT to HTTPS.
ConnectPort 443

# --- Strict allowlist: anything that does not match is DENIED ---
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterCaseSensitive Off

DisableViaHeader Yes
