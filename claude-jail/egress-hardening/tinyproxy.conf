Port 8888
Listen 0.0.0.0
Timeout 600

# The only valid clients are the ones on the 'jail-internal' network.
# The real isolation comes from the network topology (Claude has no external
# route), not from this Allow directive.
Allow 0.0.0.0/0

# Only permit CONNECT to HTTPS.
ConnectPort 443

# --- Strict allowlist: anything that does not match is DENIED ---
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/allowlist"
FilterExtended On
FilterCaseSensitive Off

DisableViaHeader Yes
