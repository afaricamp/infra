# Dependency cache for the jailed Claude ('make caches'): nginx as a caching
# reverse proxy in front of three fixed hosts, and nothing else.
#
#   :3000  Go modules                          -> https://proxy.golang.org
#          and their checksum database          -> https://sum.golang.org
#   :4873  npm packages (npm, npx, pnpm, yarn)  -> https://registry.npmjs.org
#
# The jail reaches it over jail-internal and the strict allowlist is enough to
# build: the jail itself never connects to proxy.golang.org, sum.golang.org,
# github.com or registry.npmjs.org. What it can still do is ask for any
# module or package by name (see README, security notes).
#
# Only GET and HEAD: no 'npm publish', no 'npm login', no 'npm audit' (a POST
# with the project's whole dependency list). Authorization and Cookie headers
# are dropped, so a token in a project's .npmrc never leaves through here.
# Upstream certificates are verified. Runs as UID 1000 on a read-only root
# file system: everything it writes goes to /tmp or to the cache volume.

worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 256;
}

http {
  # 'podman logs claude-cache': what the jail asked for.
  access_log /dev/stdout;
  server_tokens off;

  # Written by cache-entrypoint.sh: the DNS server of the egress network, so
  # the registries are looked up again while it runs (their addresses change).
  include /tmp/resolver.conf;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /var/cache/claude-deps/tmp;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # 5 GB each; entries nobody asked for in 90 days are dropped.
  proxy_cache_path /var/cache/claude-deps/go  levels=1:2 keys_zone=go:10m  max_size=5g inactive=90d use_temp_path=off;
  proxy_cache_path /var/cache/claude-deps/npm levels=1:2 keys_zone=npm:10m max_size=5g inactive=90d use_temp_path=off;

  proxy_http_version 1.1;
  proxy_ssl_server_name on;
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 5;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  proxy_ssl_protocols TLSv1.2 TLSv1.3;
  proxy_read_timeout 300s;

  # The upstream's Cache-Control decides how long an answer is fresh; 10
  # minutes when it says nothing. When the registry cannot be reached, what is
  # already cached is served, however old.
  proxy_cache_valid 200 10m;
  proxy_cache_valid 404 410 1m;
  proxy_cache_revalidate on;
  proxy_cache_lock on;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  proxy_cache_background_update on;
  proxy_ignore_headers Set-Cookie;
  proxy_hide_header Set-Cookie;
  add_header X-Cache $upstream_cache_status always;

  # Every request header the cache sets or drops, here and nowhere else: a
  # block with one proxy_set_header of its own loses all of these. $upstream
  # is set in each location. Accept-Encoding is dropped so that the npm
  # documents come uncompressed and sub_filter can rewrite them.
  proxy_set_header Host $upstream;
  proxy_set_header Authorization "";
  proxy_set_header Cookie "";
  proxy_set_header Accept-Encoding "";

  # Where package documents send clients for tarballs (see the npm server).
  map $http_user_agent $npm_tarballs {
    ~^npm/   https://registry.npmjs.org/;
    default  http://$http_host/;
  }

  server {
    listen 3000;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location / {
      set $upstream proxy.golang.org;
      proxy_pass https://$upstream;
      proxy_cache go;
      proxy_cache_key $request_uri;
    }

    # The checksum database. proxy.golang.org does not serve it, so the go
    # command would ask sum.golang.org itself, which the strict allowlist
    # refuses. Saying 'supported' here makes it ask through the cache. The
    # database is signed: go checks every answer against the key built into
    # it, so the cache cannot change what it says.
    location = /sumdb/sum.golang.org/supported {
      return 200;
    }
    location ~ ^/sumdb/sum\.golang\.org(?<sumdb_path>/.+)$ {
      set $upstream sum.golang.org;
      proxy_pass https://$upstream$sumdb_path;
      proxy_cache go;
      proxy_cache_key $request_uri;
    }
  }

  server {
    listen 4873;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location / {
      set $upstream registry.npmjs.org;
      proxy_pass https://$upstream;
      proxy_cache npm;
      # Clients ask for the full or the abbreviated document of a package.
      proxy_cache_key $request_uri|$http_accept;
      # Package documents point at their tarballs on registry.npmjs.org.
      # pnpm downloads them from there, so for every client but npm they are
      # rewritten to this cache. npm fetches them from the registry it is
      # given anyway, and writes the URL into package-lock.json: rewritten, it
      # would be http://claude-cache:4873/..., which only works in the jail.
      sub_filter_types application/json application/vnd.npm.install-v1+json;
      sub_filter 'https://registry.npmjs.org/' $npm_tarballs;
      sub_filter_once off;
    }
  }
}
