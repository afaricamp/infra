# Codex in the jail: read by the launchers when JAIL_AGENT=codex
# ('agent-jail codex'). key = value, parsed, never sourced; see agents/README.md.
# Its user's home in the image, the node image's (the project is mounted at
# <home>/project).
home = /home/node
# Its settings, sessions and history, kept between sessions: ~/.codex.
volumes = home:.codex
