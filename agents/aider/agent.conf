# Aider in the jail: read by the launchers when JAIL_AGENT=aider
# ('agent-jail aider'). key = value, parsed, never sourced; see agents/README.md.
# Its user's home in the image (the project is mounted at <home>/project).
home = /home/agent
# Its settings and caches, kept between sessions: ~/.aider and ~/.cache.
volumes = home:.aider cache:.cache
